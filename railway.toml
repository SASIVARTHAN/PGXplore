# Railway builds from the repository root (monorepo).
# Alternative: set service Root Directory to "backend" and use backend/railway.toml instead.
[build]
buildCommand = "cd backend && chmod +x mvnw && ./mvnw clean package -DskipTests"

[deploy]
startCommand = "java -jar backend/target/pgxplore-backend-1.0.0.jar"
healthcheckPath = "/api/auth/firebase/config"
restartPolicyType = "ON_FAILURE"
