version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pgxplore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pgxplore
      MYSQL_USER: pgxplore
      MYSQL_PASSWORD: pgxplore123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pgxplore-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_URL: jdbc:mysql://mysql:3306/pgxplore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: pgxplore
      DB_PASSWORD: pgxplore123
      JWT_SECRET: ${JWT_SECRET:-docker-compose-jwt-secret-key-minimum-32-chars}
      FIREBASE_BUCKET_NAME: ${FIREBASE_BUCKET_NAME:-pgxplore-dev.appspot.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://3.105.160.225}
      COGNITO_REGION: ${COGNITO_REGION:-ap-southeast-2}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-ap-southeast-2_YPMktk5Ex}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-2vqtsu3lavdg8g5bp5ugt7c9gm}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
