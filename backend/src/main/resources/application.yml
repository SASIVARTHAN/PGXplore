spring:
  application:
    name: pgxplore-backend
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pgxplore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Psna@psna123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        type:
          preferred_enum_jdbc_type: VARCHAR
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

pgxplore:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-256-bit-secret-key-for-production-use-only}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY:1440}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY:7}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
    bucket-name: ${FIREBASE_BUCKET_NAME:your-project.appspot.com}
    storage-folder: ${FIREBASE_STORAGE_FOLDER:pg-images}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-3.5-turbo}
  app:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  otp:
    dev-code: ${OTP_DEV_CODE:123456}
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  cognito:
    region: ${COGNITO_REGION:ap-southeast-2}
    user-pool-id: ${COGNITO_USER_POOL_ID:ap-southeast-2_YPMktk5Ex}
    client-id: ${COGNITO_CLIENT_ID:2vqtsu3lavdg8g5bp5ugt7c9gm}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.pgxplore: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

